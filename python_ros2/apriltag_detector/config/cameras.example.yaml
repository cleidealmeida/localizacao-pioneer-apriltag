# cameras.example.yaml
#
# Configuração central do sistema de localização por AprilTag.
# Copie para cameras.yaml (ignorado pelo git) e preencha na seguinte ordem:
#
#   1. `device` de cada câmera  -> ls -l /dev/v4l/by-id/
#   2. `intrinsics`             -> preenchido AUTOMATICAMENTE por calib.py
#   3. `extrinsics_W_T_C`       -> preenchido AUTOMATICAMENTE por reverse_localization.py
#   4. Tamanhos das tags        -> MEDIR COM RÉGUA o lado preto externo, em metros.
#
# ATENÇÃO — inconsistência herdada dos códigos antigos:
#   MATLAB usava 0.196 m e Python usava 0.119 m para "a" tag. Se a tag do robô
#   e a de referência forem diferentes, os dois valores abaixo devem refletir
#   isso; se for a mesma tag, um dos códigos antigos estava errado. Erro no
#   tamanho da tag vira erro PROPORCIONAL na posição estimada.

tag:
  family: tag36h11        # unificado (o antigo 'tag36h1' do Python era typo)
  robot_tag_size: 0.119   # [m] lado da tag fixada no topo do Pioneer  <- MEDIR
  robot_tag_id: 0         # id da tag do robô (definir e imprimir de acordo)
  reference_tag_size: 0.196  # [m] lado da tag de referência na origem <- MEDIR
  reference_tag_id: 1     # id da tag de referência (deve ser != robot_tag_id)

cameras:
  camera_1:
    device: /dev/v4l/by-id/CHANGE_ME-camera-1-video-index0
    width: 640
    height: 480
    intrinsics:           # <- calib.py escreve aqui
      fx: null
      fy: null
      cx: null
      cy: null
      dist: null
    extrinsics_W_T_C: null  # <- reverse_localization.py escreve aqui (matriz 4x4)

  camera_2:
    device: /dev/v4l/by-id/CHANGE_ME-camera-2-video-index0
    width: 640
    height: 480
    intrinsics:
      fx: null
      fy: null
      cx: null
      cy: null
      dist: null
    extrinsics_W_T_C: null
