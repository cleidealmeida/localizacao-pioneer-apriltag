name: CI
on: [push, pull_request]
jobs:
  test-kalman:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: pip install numpy scipy
      - name: Teste do Filtro de Kalman (simulação offline)
        # caminho canônico: python_ros2/pose_estimator/tests/test_kalman.py
        run: python python_ros2/pose_estimator/tests/test_kalman.py
